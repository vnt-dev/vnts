# Bind addresses. Remove a line to disable that listener.
tcp_bind = "0.0.0.0:29872"
quic_bind = "0.0.0.0:29872"
ws_bind = "0.0.0.0:29872"

# Default virtual network.
network = "10.26.0.0/24"

# Whitelisted network codes.
white_list = []

# Lease duration in seconds.
lease_duration = 86400

# Web admin UI/API.
web_bind = "0.0.0.0:29871"
username = "admin"
password = "admin"

# Persist networks, devices and peer server records into SQLite.
persistence = true

# Leave these unset to let the server auto-generate cert.pem / key.pem.
# cert = "cert.pem"
# key = "key.pem"

# Optional peer-server settings.
# server_quic_bind = "0.0.0.0:29873"
# peer_servers = ["server1.example.com:29873", "192.168.1.100:29873"]
# server_token = "your-secret-token"

[custom_nets]
# net1 = "10.25.0.0/24"
# net2 = "10.27.1.0/24"
